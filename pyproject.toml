[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flakehunt"
version = "0.1.0"
description = "Find flaky tests, then find the test that poisons them. Runner-agnostic via JUnit XML; offline, zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nithin Selvaraj" }]
keywords = ["flaky-tests", "testing", "pytest", "junit", "delta-debugging", "test-pollution", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "mypy", "build"]

[project.scripts]
flakehunt = "flakehunt.cli:main"

[project.urls]
Homepage = "https://github.com/Nithinfgs/flakehunt"
Issues = "https://github.com/Nithinfgs/flakehunt/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flakehunt = ["_demo/pytest.ini", "_demo/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/flakehunt/_demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["UP007", "UP045", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/flakehunt"]
exclude = ["_demo"]
