<svg xmlns="http://www.w3.org/2000/svg" width="912" height="520" viewBox="0 0 912 520" role="img" aria-label="flakehunt demo terminal output"><rect width="100%" height="100%" rx="10" fill="#0d1117"/><circle cx="25" cy="18" r="6" fill="#ff5f56"/><circle cx="45" cy="18" r="6" fill="#ffbd2e"/><circle cx="65" cy="18" r="6" fill="#27c93f"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#c9d1d9" xml:space="preserve"><text x="18" y="54" opacity="0" style="white-space:pre"><tspan fill="#6e7681">$</tspan><tspan> flakehunt demo</tspan><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0272;0.97;1" values="0;1;0;0"/></text><text x="18" y="74" opacity="0" style="white-space:pre"><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1335;0.97;1" values="0;1;0;0"/></text><text x="18" y="94" opacity="0" style="white-space:pre"><tspan font-weight="700">flakehunt</tspan><tspan> </tspan><tspan fill="#6e7681">·</tspan><tspan> 12 runs </tspan><tspan fill="#6e7681">·</tspan><tspan> 28 tests </tspan><tspan fill="#6e7681">·</tspan><tspan> </tspan><tspan fill="#6e7681">pytest -q</tspan><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1444;0.97;1" values="0;1;0;0"/></text><text x="18" y="114" opacity="0" style="white-space:pre"><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1553;0.97;1" values="0;1;0;0"/></text><text x="18" y="134" opacity="0" style="white-space:pre"><tspan fill="#e3b341" font-weight="700">FLAKY (2)</tspan><tspan fill="#6e7681">  passed and failed on identical code</tspan><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1662;0.97;1" values="0;1;0;0"/></text><text x="18" y="154" opacity="0" style="white-space:pre"><tspan>  </tspan><tspan font-weight="700">tests/test_sync.py::test_websocket_reconnects</tspan><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1771;0.97;1" values="0;1;0;0"/></text><text x="18" y="174" opacity="0" style="white-space:pre"><tspan>    </tspan><tspan fill="#ff7b72">5/12 failed</tspan><tspan> (42%)  </tspan><tspan fill="#ff7b72">✗</tspan><tspan fill="#ff7b72">✗</tspan><tspan fill="#6e7681">·</tspan><tspan fill="#6e7681">·</tspan><tspan fill="#6e7681">·</tspan><tspan fill="#ff7b72">✗</tspan><tspan fill="#6e7681">·</tspan><tspan fill="#6e7681">·</tspan><tspan fill="#6e7681">·</tspan><tspan fill="#ff7b72">✗</tspan><tspan fill="#ff7b72">✗</tspan><tspan fill="#6e7681">·</tspan><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1880;0.97;1" values="0;1;0;0"/></text><text x="18" y="194" opacity="0" style="white-space:pre"><tspan>    </tspan><tspan fill="#6e7681">fails with:</tspan><tspan> ConnectionRefusedError: [Errno N] Connection refused: ws://N.N:N</tspan><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1989;0.97;1" values="0;1;0;0"/></text><text x="18" y="214" opacity="0" style="white-space:pre"><tspan>    </tspan><tspan fill="#79c0ff">suspect:</tspan><tspan> network or service startup </tspan><tspan fill="#6e7681">- wait for readiness explicitly</tspan><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2098;0.97;1" values="0;1;0;0"/></text><text x="18" y="234" opacity="0" style="white-space:pre"><tspan>  </tspan><tspan font-weight="700">tests/test_sync.py::test_cache_warms_before_deadline</tspan><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2207;0.97;1" values="0;1;0;0"/></text><text x="18" y="254" opacity="0" style="white-space:pre"><tspan>    </tspan><tspan fill="#ff7b72">2/12 failed</tspan><tspan> (17%)  </tspan><tspan fill="#ff7b72">✗</tspan><tspan fill="#6e7681">·</tspan><tspan fill="#6e7681">·</tspan><tspan fill="#6e7681">·</tspan><tspan fill="#6e7681">·</tspan><tspan fill="#6e7681">·</tspan><tspan fill="#6e7681">·</tspan><tspan fill="#6e7681">·</tspan><tspan fill="#6e7681">·</tspan><tspan fill="#6e7681">·</tspan><tspan fill="#6e7681">·</tspan><tspan fill="#ff7b72">✗</tspan><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2316;0.97;1" values="0;1;0;0"/></text><text x="18" y="274" opacity="0" style="white-space:pre"><tspan>    </tspan><tspan fill="#6e7681">fails with:</tspan><tspan> TimeoutError: cache warm-up exceeded Ns deadline (took Ns)</tspan><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2425;0.97;1" values="0;1;0;0"/></text><text x="18" y="294" opacity="0" style="white-space:pre"><tspan>    </tspan><tspan fill="#79c0ff">suspect:</tspan><tspan> timing </tspan><tspan fill="#6e7681">- poll instead of sleeping or tight deadlines</tspan><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2534;0.97;1" values="0;1;0;0"/></text><text x="18" y="314" opacity="0" style="white-space:pre"><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2643;0.97;1" values="0;1;0;0"/></text><text x="18" y="334" opacity="0" style="white-space:pre"><tspan fill="#ff7b72" font-weight="700">ALWAYS FAILING (2)</tspan><tspan fill="#6e7681">  broken, not flaky</tspan><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2752;0.97;1" values="0;1;0;0"/></text><text x="18" y="354" opacity="0" style="white-space:pre"><tspan>  tests/test_legacy.py::test_2019_tax_table  </tspan><tspan fill="#6e7681">AssertionError: tax table 2019 was removed in the v3 migration</tspan><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2861;0.97;1" values="0;1;0;0"/></text><text x="18" y="374" opacity="0" style="white-space:pre"><tspan>    </tspan><tspan fill="#6e7681">also fails alone: genuinely broken</tspan><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2970;0.97;1" values="0;1;0;0"/></text><text x="18" y="394" opacity="0" style="white-space:pre"><tspan>  tests/test_settings.py::test_default_timeout_is_30s  </tspan><tspan fill="#6e7681">assert 1 == 30</tspan><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3079;0.97;1" values="0;1;0;0"/></text><text x="18" y="414" opacity="0" style="white-space:pre"><tspan>    </tspan><tspan fill="#e3b341">passes when run alone</tspan><tspan> </tspan><tspan fill="#6e7681">-&gt; order-dependent:</tspan><tspan> flakehunt why tests/test_settings.py::test_default_timeout_is_30s</tspan><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3188;0.97;1" values="0;1;0;0"/></text><text x="18" y="434" opacity="0" style="white-space:pre"><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3297;0.97;1" values="0;1;0;0"/></text><text x="18" y="454" opacity="0" style="white-space:pre"><tspan fill="#6e7681">23 stable, 2 flaky, 2 always failing</tspan><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3406;0.97;1" values="0;1;0;0"/></text><text x="18" y="474" opacity="0" style="white-space:pre"><tspan fill="#6e7681">Odds a flaky test is caught in 12 runs, by its failure rate: 50%: 99%, 20%: 93%, 10%: 71%, 5%: 45%</tspan><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3515;0.97;1" values="0;1;0;0"/></text><text x="18" y="494" opacity="0" style="white-space:pre"><tspan fill="#6e7681">Passes alone but fails in the suite? </tspan><tspan>flakehunt why &lt;node id&gt; </tspan><tspan fill="#6e7681">(pytest) finds the test polluting it.</tspan><animate attributeName="opacity" dur="14.7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3624;0.97;1" values="0;1;0;0"/></text></g></svg>